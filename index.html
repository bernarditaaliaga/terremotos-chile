<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terremotos de Chile desde 1900</title>
<style>
  :root {
    --bg: #f7f3ec;
    --ink: #1f2430;
    --muted: #6b7280;
    --grid: #e4e0d8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--ink);
    background: radial-gradient(1100px 380px at 50% -120px, #f1dfcb 0%, var(--bg) 62%) fixed;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.4;
  }
  main { max-width: 1500px; margin: 0 auto; padding: 22px 24px 40px; }

  /* Portada con un sismograma dibujado con los datos reales */
  .hero {
    position: relative; overflow: hidden; border-radius: 14px; padding: 22px 26px 0; color: #fff; margin-bottom: 14px;
    background: linear-gradient(120deg, #1b1f2a 0%, #2a2230 48%, #8f3513 100%);
    box-shadow: 0 10px 30px rgba(31, 36, 48, 0.18);
  }
  .hero h1 { font-size: clamp(1.5rem, 3.4vw, 2.3rem); line-height: 1.15; margin: 0 0 4px; }
  .hero .sub { color: rgba(255, 255, 255, 0.78); margin: 0 0 4px; }
  #heroSismo { display: block; width: 100%; height: 64px; margin-top: 6px; }
  #heroSismo path { fill: none; stroke: rgba(255, 255, 255, 0.78); stroke-width: 1.3; vector-effect: non-scaling-stroke; stroke-linejoin: round;
    stroke-dasharray: 1; stroke-dashoffset: 1; animation: trazo 3s ease-out 0.2s forwards; }
  @keyframes trazo { to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) { #heroSismo path { animation: none; stroke-dashoffset: 0; } }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .stat { background: #fff; border: 1px solid var(--grid); border-top: 4px solid var(--c, var(--ink)); border-radius: 12px; padding: 10px 14px; box-shadow: 0 3px 10px rgba(31, 36, 48, 0.05); }
  .stat b { display: block; font-size: 1.55rem; line-height: 1.1; }
  .stat span { font-size: 0.82rem; color: var(--muted); }

  .card { position: relative; background: #fff; border: 1px solid var(--grid); border-radius: 14px; padding: 14px; box-shadow: 0 6px 24px rgba(31, 36, 48, 0.07); }
  button {
    font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--ink);
    background: linear-gradient(135deg, #1f2430, #4a2a22); color: #fff; cursor: pointer;
  }
  button.sec { background: #fff; color: var(--ink); }
  button:focus-visible, .sismo:focus-visible { outline: 3px solid #2f6fed; outline-offset: 2px; }
  .barra { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin-bottom: 8px; font-size: 0.9rem; }
  .chip { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
  .chip input { accent-color: var(--ink); }
  .forma { font-size: 13px; line-height: 1; }
  .escala { display: inline-flex; align-items: center; gap: 6px; font-size: 0.85rem; }
  .escala i { width: 110px; height: 10px; border-radius: 5px; display: inline-block; }
  .barra label.mag { display: flex; align-items: center; gap: 8px; }
  .barra input[type=range] { width: 120px; }
  details.ajustes { font-size: 0.85rem; color: var(--muted); }
  details.ajustes summary { cursor: pointer; list-style: none; }
  details.ajustes .cont { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding: 8px 0 2px; }
  #status { font-size: 0.85rem; color: var(--muted); min-height: 1.2em; margin-bottom: 4px; }
  .cuerpo { display: grid; grid-template-columns: minmax(0, 1fr) clamp(190px, 21vw, 240px); gap: 8px; align-items: start; }
  @media (max-width: 760px) { .cuerpo { grid-template-columns: 1fr; } }
  .lienzoWrap { position: relative; }
  #ejeY { position: absolute; left: 0; top: 0; width: 40px; height: 100%; pointer-events: none; }
  #ejeY span { position: absolute; right: 6px; font-size: 12px; color: var(--muted); transform: translateY(-50%); white-space: nowrap; }
  #lienzo { overflow-x: auto; margin-left: 40px; padding-bottom: 14px; }
  svg { display: block; }
  .tick text { font-size: 14px; font-weight: 600; fill: var(--ink); }
  .lbl { font-size: 12px; font-weight: 700; fill: var(--ink); paint-order: stroke; stroke: #fff; stroke-width: 3px; stroke-linejoin: round; }
  .banda { font-size: 11px; font-weight: 700; fill: #b45309; letter-spacing: 0.04em; }
  .sismo { cursor: pointer; }
  .sismo .tallo { stroke-width: 2; stroke-opacity: 0.6; }
  .sismo .q { stroke: rgba(31, 36, 48, 0.45); stroke-width: 1; }
  .sismo:hover .q, .sismo.sel .q { stroke: var(--ink); stroke-width: 2.5; }
  .sismo.sonando .q { stroke: var(--ink); stroke-width: 3.5; }
  .sismo.fantasma { opacity: 0.14; pointer-events: none; }
  .sismo.fantasma .q { stroke: none; }
  .guia { visibility: hidden; pointer-events: none; }
  .guia.on { visibility: visible; }
  #playhead { stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 4 3; }
  .ayuda { font-size: 0.85rem; color: var(--muted); margin-top: 2px; }

  /* Mapa */
  .mapaWrap { position: relative; }
  #mapa { border-radius: 10px; width: 100%; height: auto; cursor: grab; touch-action: none; }
  #mapa.arrastrando { cursor: grabbing; }
  .zoomBtns { position: absolute; top: 8px; right: 8px; display: flex; flex-direction: column; gap: 4px; }
  button.zb { padding: 1px 9px; font-size: 1.15rem; line-height: 1.3; background: #fff; color: var(--ink); border: 1px solid #b8c4cf; border-radius: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  #mapa .oceano-fondo { fill: #dbe9f1; }
  #mapa .vecino { fill: #ebe6da; stroke: #cfc8b8; stroke-width: 0.6; }
  #mapa .costa { fill: #fbf6ea; stroke: #8d8576; stroke-width: 1; }
  #mapa .ciudad { font-size: calc(12.5px / var(--z, 1)); fill: #4b5563; paint-order: stroke; stroke: #fff; stroke-width: 3px; stroke-linejoin: round; }
  #mapa .oceano { font-size: calc(10.5px / var(--z, 1)); font-style: italic; fill: #4b6a82; }
  #mapa .flecha { stroke: #4b6a82; stroke-width: 1.6; }
  #mapa .flechaPunta { fill: #4b6a82; }
  #mapa .ep { stroke: rgba(31, 36, 48, 0.4); stroke-width: 0.5; opacity: 0.9; vector-effect: non-scaling-stroke; cursor: pointer; transform-box: fill-box; transform-origin: center; transform: scale(calc(2 / (1 + var(--z, 1)))); }
  #mapa .ep.fantasma { opacity: 0.18; stroke: none; cursor: default; pointer-events: none; }
  #mapa .ep.sel { stroke: var(--ink); stroke-width: 1.6; opacity: 1; }
  #mapa .pulso { fill: none; stroke: var(--ink); stroke-width: 1.8; transform-box: fill-box; transform-origin: center; animation: onda 1.3s ease-out forwards; }
  @keyframes onda { from { transform: scale(1); opacity: 0.95; } to { transform: scale(9); opacity: 0; } }

  #tip {
    position: absolute; z-index: 5; pointer-events: none; background: var(--ink); color: #fff;
    padding: 8px 10px; border-radius: 8px; font-size: 0.85rem; line-height: 1.35; white-space: nowrap;
    transform: translate(-50%, -100%); box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
  }
  #tip b { font-size: 0.95rem; }
  #tip .en { color: #fcd34d; }
  .fuente { margin-top: 14px; font-size: 0.8rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <header class="hero">
    <h1 id="titular"></h1>
    <p class="sub" id="bajada"></p>
    <svg id="heroSismo" viewBox="0 0 1000 64" preserveAspectRatio="none" aria-hidden="true"></svg>
  </header>
  <div class="stats" id="stats"></div>

  <section class="card" id="tarjeta" aria-label="Terremotos de Chile">
    <div class="barra">
      <button id="btnPlay">▶ Escuchar la historia</button>
      <button id="btnStop" class="sec" hidden>■ Detener</button>
      <label class="chip"><input type="checkbox" id="cSup" checked><span class="forma">●</span>Superficial</label>
      <label class="chip"><input type="checkbox" id="cMed" checked><span class="forma">◆</span>Intermedio</label>
      <label class="chip"><input type="checkbox" id="cProf" checked><span class="forma">▲</span>Profundo</label>
      <label class="mag">Magnitud mínima <b id="vMag">7.0</b>
        <input id="minMag" type="range" min="7" max="9" step="0.1" value="7">
      </label>
      <span class="escala" title="Color = magnitud (el mismo dato que la altura)"><b>7</b><i id="gradiente"></i><b>9,5</b></span>
      <details class="ajustes">
        <summary title="Ajustes de sonido">⚙ Ajustes</summary>
        <div class="cont">
          <label>Tiempo por terremoto: <b id="vRitmo">2,5 s</b>
            <input id="ritmo" type="range" min="1" max="6" step="0.5" value="2.5">
          </label>
          <label>Sincronía sonido-gráfico: <b id="vSync">0 ms</b>
            <input id="sync" type="range" min="0" max="600" step="25" value="0">
          </label>
          <button id="btnTest" class="sec" title="Emite un tono de prueba y muestra el estado del audio">🔊 Probar sonido</button>
          <span id="version"></span>
        </div>
      </details>
    </div>
    <div id="status" aria-live="polite"></div>

    <div class="cuerpo">
      <div>
        <div class="lienzoWrap">
          <div id="ejeY" aria-hidden="true"></div>
          <div id="lienzo">
            <svg id="chart" role="img"
                 aria-label="Terremotos de magnitud 7 o más en Chile: año en el eje horizontal, magnitud en el vertical"></svg>
          </div>
        </div>
        <div class="ayuda">👆 Cursor: detalle · Clic: escúchalo · 🔊 más grave y largo = más fuerte</div>
      </div>
      <div class="mapaWrap">
        <svg id="mapa" viewBox="0 0 300 620" role="img" aria-label="Mapa de Chile con los epicentros. Se puede acercar con la rueda del mouse y arrastrar."></svg>
        <div class="zoomBtns">
          <button class="zb" id="zMas" title="Acercar" aria-label="Acercar el mapa">+</button>
          <button class="zb" id="zMenos" title="Alejar" aria-label="Alejar el mapa">−</button>
          <button class="zb" id="zReset" title="Ver todo Chile" aria-label="Ver todo Chile">⟲</button>
        </div>
      </div>
    </div>
    <div id="tip" hidden></div>
  </section>

  <p class="fuente">Datos: USGS · magnitud 7 o más · 1900–2026</p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<script src="data.js?v=2"></script>
<script src="chile.js?v=2"></script>
<script>
const VERSION_SONIDO = 'sonido-9 (retumbo de terremoto: grave = grande) · color = magnitud';

// ---------- Datos ----------
const eventos = TERREMOTOS.map(e => {
  const [y, m, d] = e.fecha.split('-').map(Number);
  const [hh, mm, ss] = (e.hora || '12:00:00').split(':').map(Number);   // hora UTC (USGS): ordena los eventos del mismo día
  const t = y + ((Date.UTC(y, m - 1, d, hh, mm, ss) - Date.UTC(y, 0, 1)) / 86400000) / 365.25;
  return { ...e, t, anio: y };
});

const claseProf = p => p < 50 ? 'sup' : (p <= 100 ? 'med' : 'prof');
const nombreClase = { sup: 'Superficial', med: 'Intermedio', prof: 'Profundo' };
const fmtMag = m => m.toFixed(1).replace('.', ',');

// Color = magnitud (el mismo dato que la altura de la barra, así que no se pierde información si no se distinguen los colores):
// verde (M7) -> amarillo -> naranjo -> rojo oscuro (M9,5). Profundidad = forma del marcador: círculo, rombo, triángulo.
const PARADAS = [[7.0, [143, 209, 79]], [7.5, [233, 226, 61]], [8.0, [247, 168, 35]], [8.6, [232, 67, 30]], [9.5, [139, 10, 10]]];
function colorMag(m) {
  const mm = Math.min(Math.max(m, 7), 9.5);
  for (let i = 1; i < PARADAS.length; i++) {
    if (mm <= PARADAS[i][0]) {
      const [m0, c0] = PARADAS[i - 1], [m1, c1] = PARADAS[i], f = (mm - m0) / (m1 - m0);
      return 'rgb(' + c0.map((v, k) => Math.round(v + (c1[k] - v) * f)).join(',') + ')';
    }
  }
}
document.getElementById('gradiente').style.background =
  'linear-gradient(to right, ' + PARADAS.map(([m, c]) => `rgb(${c.join(',')}) ${((m - 7) / 2.5 * 100).toFixed(0)}%`).join(', ') + ')';
function marcador(clase, x, y, r, color) {
  if (clase === 'sup') return el('circle', { cx: x, cy: y, r, fill: color });
  if (clase === 'med') { const d = r * 1.35; return el('polygon', { points: `${x},${y - d} ${x + d},${y} ${x},${y + d} ${x - d},${y}`, fill: color }); }
  const d = r * 1.3; return el('polygon', { points: `${x},${y - d} ${x + d * 1.1},${y + d * 0.8} ${x - d * 1.1},${y + d * 0.8}`, fill: color });
}

// ---------- Portada: titular, tarjetas de contexto y un sismograma con los datos reales ----------
(function portada() {
  const mayor = eventos.reduce((a, b) => (b.mag > a.mag ? b : a));
  const n = eventos.length, g8 = eventos.filter(e => e.mag >= 8).length;
  document.getElementById('titular').textContent = `${n} terremotos de magnitud 7+ en Chile desde 1900`;
  document.getElementById('bajada').textContent = 'Cada barra es un terremoto: la altura y el color indican su magnitud';

  const cada = ((2026 - 1900) / n).toFixed(1).replace('.', ',');
  const tarjetas = [
    [n, 'terremotos de M7 o más', colorMag(7)],
    [g8, 'de M8 o más (grandes terremotos)', colorMag(8.3)],
    ['1 cada ' + cada + ' años', 'en promedio desde 1900', '#6b7280'],
    ['M' + fmtMag(mayor.mag), `${mayor.lugar} ${mayor.anio}: el mayor registrado en el mundo`, colorMag(9.5)]
  ];
  document.getElementById('stats').innerHTML = tarjetas.map(([g, t, c]) =>
    `<div class="stat" style="--c:${c}"><b>${g}</b><span>${t}</span></div>`).join('');

  // sismograma decorativo: cada pico es un terremoto real (su posición es el año y su altura, la magnitud)
  let semilla = 7;
  const azar = () => { semilla = (semilla * 16807) % 2147483647; return semilla / 2147483647; };
  const ev = eventos.map(e => ({ x: (e.t - 1900) / 127 * 1000, a: (e.mag - 6.6) / 3 * 27 }));
  const pts = [];
  for (let x = 0; x <= 1000; x += 1.5) {
    let y = (azar() - 0.5) * 3;
    for (const k of ev) { const dx = x - k.x; if (dx >= 0 && dx < 40) y += k.a * Math.exp(-dx / 9) * Math.sin(dx * 1.1) * (dx < 2 ? dx / 2 : 1); }
    pts.push([x, Math.min(61, Math.max(3, 32 - y))]);
  }
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('d', 'M' + pts.map(([x, y]) => x.toFixed(1) + ',' + y.toFixed(1)).join('L'));
  p.setAttribute('pathLength', '1');
  document.getElementById('heroSismo').appendChild(p);
})();

// ---------- Sismograma ----------
// Horizontal: tiempo. Vertical: magnitud (la altura de cada barra es la magnitud: posición y longitud son lo que mejor lee el ojo).
// Forma: profundidad. La geografía va en el mapa de la derecha.
const svg = document.getElementById('chart');
const NS = 'http://www.w3.org/2000/svg';
let W = 800;
const H = 470, M = { l: 14, r: 24, t: 34, b: 46 };
let iw = W - M.l - M.r;
const ih = H - M.t - M.b;
const M_MIN = 6.6, M_MAX = 9.6;   // el eje parte en 6,6 para que los M7 tengan barra visible; las marcas empiezan en 7
const RADIO = 4.5;
const estado = { minMag: 7, desde: 1900, hasta: 2026, sup: true, med: true, prof: true, sel: null };
let animando = null;

function el(nombre, attrs = {}, texto) {
  const n = document.createElementNS(NS, nombre);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (texto !== undefined) n.textContent = texto;
  return n;
}

const xDe = t => M.l + ((t - estado.desde) / (estado.hasta + 1 - estado.desde)) * iw;
const yMag = m => M.t + (1 - (m - M_MIN) / (M_MAX - M_MIN)) * ih;
const BASE = M.t + ih;

const enRango = () => eventos.filter(e => e.anio >= estado.desde && e.anio <= estado.hasta);
function visibles() {   // los que cumplen los filtros (los demás quedan como "fantasmas": se ven tenues, pero no se pierde información)
  return enRango().filter(e => e.mag >= estado.minMag && estado[claseProf(e.prof)]);
}

// Regresión isotónica (PAV): la secuencia no decreciente más cercana a la dada.
function noDecreciente(v) {
  const b = [];
  for (const val of v) {
    b.push({ s: val, n: 1 });
    while (b.length > 1 && b[b.length - 2].s / b[b.length - 2].n >= b[b.length - 1].s / b[b.length - 1].n) {
      const y = b.pop(), x = b.pop(); b.push({ s: x.s + y.s, n: x.n + y.n });
    }
  }
  const out = [];
  b.forEach(k => { for (let i = 0; i < k.n; i++) out.push(k.s / k.n); });
  return out;
}

// Orden estricto: cada terremoto queda siempre a la derecha del anterior, con un paso mínimo (así las barras no se tapan
// y la línea de reproducción avanza sin devolverse). Cuando hay varios seguidos se desplazan lo mínimo posible.
// Las posiciones se calculan con TODOS los terremotos, así no se mueve nada al filtrar.
let PASO = 14;
function posiciones(lista) {
  const orden = [...lista].sort((a, b) => a.t - b.t);
  const n = orden.length;
  const y0 = orden.map((e, i) => xDe(e.t) - i * PASO);
  const lo = M.l, hi = W - M.r - (n - 1) * PASO;
  const y = noDecreciente(y0).map(v => Math.min(Math.max(v, lo), Math.max(lo, hi)));
  const pos = new Map();
  orden.forEach((e, i) => pos.set(e, { x0: xDe(e.t), x: y[i] + i * PASO, y: yMag(e.mag) }));
  return pos;
}

let ultimaPos = new Map(), guias = new Map();
function mostrarGuia(e, on) {   // marca en el eje con la fecha exacta, solo al pasar el cursor o al seleccionar
  const g = guias.get(e);
  if (g) g.forEach(n => n.classList.toggle('on', on || estado.sel === e));
}

function colocarEjeY() {
  const eje = document.getElementById('ejeY');
  eje.innerHTML = '';
  const k = svg.clientHeight / H;
  const pon = (texto, y) => { const sp = document.createElement('span'); sp.textContent = texto; sp.style.top = (y * k) + 'px'; eje.appendChild(sp); };
  [7, 7.5, 8, 8.5, 9, 9.5].forEach(m => pon(fmtMag(m), yMag(m)));
}
// El gráfico se ajusta al ancho real de su contenedor: se redibuja cuando ese ancho cambia (al cargar la página o al cambiar la ventana).
let anchoUsado = 0, tamTimer = null;
new ResizeObserver(() => {
  clearTimeout(tamTimer);
  tamTimer = setTimeout(() => {
    const a = document.getElementById('lienzo').clientWidth;
    if (!animando && Math.abs(a - anchoUsado) > 1) dibujar();
  }, 120);
}).observe(document.getElementById('lienzo'));

function dibujar() {
  const ancho = document.getElementById('lienzo').clientWidth || 800;
  anchoUsado = ancho;
  const todos = enRango();
  const vis = visibles(), visSet = new Set(vis);
  W = Math.max(ancho, todos.length * 9.2 + M.l + M.r + 20);   // crece (con scroll) solo si no caben todos
  PASO = Math.max(9.2, Math.min(12, (W - M.l - M.r - 20) / Math.max(todos.length, 1)));
  iw = W - M.l - M.r;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.style.width = W + 'px';
  svg.style.height = H + 'px';
  svg.innerHTML = '';
  const g = el('g');
  svg.appendChild(g);

  // marcas de magnitud
  [7, 7.5, 8, 8.5, 9, 9.5].forEach(m => {
    const y = yMag(m);
    g.appendChild(el('line', { x1: M.l, x2: W - M.r, y1: y, y2: y, stroke: m % 1 === 0 ? '#e4e0d8' : '#efece5', 'stroke-width': 1 }));
  });
  g.appendChild(el('line', { x1: M.l, x2: W - M.r, y1: BASE, y2: BASE, stroke: '#9aa0a6', 'stroke-width': 1.5 }));

  // eje de años
  const span = estado.hasta + 1 - estado.desde;
  const porAnio = iw / span;
  const paso = [1, 2, 5, 10].find(p => p * porAnio >= 56) || 10;
  for (let a = Math.ceil(estado.desde / paso) * paso; a <= estado.hasta + 1; a += paso) {
    const x = xDe(a);
    g.appendChild(el('line', { x1: x, x2: x, y1: M.t, y2: BASE, stroke: '#efece5', 'stroke-width': 1 }));
    const t = el('g', { class: 'tick' });
    t.appendChild(el('text', { x, y: BASE + 24, 'text-anchor': 'middle' }, a));
    g.appendChild(t);
  }

  const pos = posiciones(todos);
  ultimaPos = pos; guias = new Map();

  // marcas de fecha exacta en el eje (se ven al pasar el cursor, solo para las barras desplazadas)
  vis.forEach(e => {
    const o = pos.get(e);
    if (Math.abs(o.x - o.x0) > 3) {
      const l = el('line', { class: 'guia', x1: o.x0, x2: o.x, y1: BASE, y2: BASE, stroke: '#1f2430', 'stroke-width': 3 });
      const d = el('circle', { class: 'guia', cx: o.x0, cy: BASE, r: 3.5, fill: '#1f2430' });
      g.appendChild(l); g.appendChild(d);
      guias.set(e, [l, d]);
    }
  });

  // barras (tallo + marcador): la altura es la magnitud; los que no cumplen los filtros quedan tenues
  [...todos.filter(e => !visSet.has(e)), ...vis].forEach(e => {
    const o = pos.get(e);
    const fantasma = !visSet.has(e);
    const color = colorMag(e.mag);
    const s = el('g', {
      class: 'sismo' + (fantasma ? ' fantasma' : '') + (estado.sel === e ? ' sel' : ''),
      'aria-label': `${e.lugar}, ${e.fecha}, magnitud ${e.mag}, profundidad ${Math.round(e.prof)} kilómetros`
    });
    if (!fantasma) { s.setAttribute('tabindex', 0); s.setAttribute('role', 'button'); }
    s.appendChild(el('line', { class: 'tallo', x1: o.x, x2: o.x, y1: BASE, y2: o.y, stroke: color }));
    const c = marcador(claseProf(e.prof), o.x, o.y, RADIO, color);
    c.setAttribute('class', 'q');
    s.appendChild(c);
    if (!fantasma) {
      s.appendChild(el('rect', { x: o.x - PASO / 2, y: o.y - RADIO - 2, width: PASO, height: BASE - o.y + RADIO + 2, fill: 'transparent' }));   // zona sensible
      s.addEventListener('mouseenter', () => { mostrarTip(e); mostrarGuia(e, true); marcarMapa(e, true); if (!animando) enfocarMapa(e); });
      s.addEventListener('mouseleave', () => { if (!animando) { ocultarTip(); verTodoElMapa(350); } mostrarGuia(e, false); marcarMapa(e, estado.sel === e); });
      s.addEventListener('focus', () => { mostrarTip(e); marcarMapa(e, true); if (!animando) enfocarMapa(e); });
      s.addEventListener('blur', () => { if (!animando) { ocultarTip(); verTodoElMapa(350); } marcarMapa(e, estado.sel === e); });
      s.addEventListener('click', () => { estado.sel = e; marcar(); sonar(e); ondaMapa(e); mostrarTip(e); });
      s.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); s.dispatchEvent(new Event('click')); } });
    }
    s._e = e; c._e = e; c._g = s;
    g.appendChild(s);
  });

  // etiquetas de los mayores, encima del marcador
  vis.filter(e => e.mag >= 8.5).forEach(e => {
    const o = pos.get(e);
    g.appendChild(el('text', { class: 'lbl', x: o.x, y: o.y - RADIO - 8, 'text-anchor': 'middle' }, `${e.anio} · M${fmtMag(e.mag)}`));
  });

  g.appendChild(el('line', { id: 'playhead', y1: M.t, y2: BASE, x1: -10, x2: -10 }));
  document.getElementById('status').textContent = vis.length === todos.length ? `${vis.length} terremotos` : `${vis.length} de ${todos.length} terremotos`;
  colocarEjeY();
  dibujarMapa(todos, visSet);
}

function marcar() {
  svg.querySelectorAll('.sismo').forEach(s => { s.classList.toggle('sel', s._e === estado.sel); mostrarGuia(s._e, false); });
  document.querySelectorAll('#mapa .ep').forEach(c => c.classList.toggle('sel', c._e === estado.sel));
}

// ---------- Mapa de Chile (con océano, países vecinos y la placa de Nazca) ----------
const mapa = document.getElementById('mapa');
const MH = 620, MW = 300, MPAD = 12;
const LAT_N = -17, LAT_S = -56;
const KM = (MH - 2 * MPAD) / (LAT_N - LAT_S);          // píxeles por grado de latitud
const COSF = Math.cos(36.5 * Math.PI / 180);            // la longitud se acorta con la latitud
const lonMin = Math.min(...CHILE_MAPA.flat().map(p => p[0]));
const proyMapa = (lon, lat) => [92 + (lon - lonMin) * COSF * KM, MPAD + (LAT_N - lat) * KM];
const ciudades = [
  ['Arica', -70.31, -18.48], ['Antofagasta', -70.4, -23.65], ['Valparaíso', -71.62, -33.05],
  ['Concepción', -73.05, -36.83], ['Valdivia', -73.25, -39.81], ['Punta Arenas', -70.91, -53.16]
];
let puntosMapa = new Map();
const trazo = poli => 'M' + poli.map(([lo, la]) => proyMapa(lo, la).map(v => v.toFixed(1)).join(',')).join('L') + 'Z';

function dibujarMapa(todos, visSet) {
  mapa.innerHTML = '';
  const g = el('g');
  mapa.appendChild(g);
  g.appendChild(el('rect', { class: 'oceano-fondo', x: 0, y: 0, width: MW, height: MH }));
  VECINOS_MAPA.forEach(poli => g.appendChild(el('path', { class: 'vecino', d: trazo(poli) })));
  CHILE_MAPA.forEach(poli => g.appendChild(el('path', { class: 'costa', d: trazo(poli) })));

  // la placa de Nazca se hunde bajo Sudamérica: por eso hay terremotos (esquema)
  const yN = proyMapa(-75, -27)[1];
  g.appendChild(el('line', { class: 'flecha', x1: 8, x2: 62, y1: yN, y2: yN }));
  g.appendChild(el('polygon', { class: 'flechaPunta', points: `62,${yN - 5} 73,${yN} 62,${yN + 5}` }));
  g.appendChild(el('text', { class: 'oceano', x: 8, y: yN - 9 }, 'Placa de Nazca'));
  g.appendChild(el('text', { class: 'oceano', x: 8, y: yN + 20 }, 'se hunde bajo'));
  g.appendChild(el('text', { class: 'oceano', x: 8, y: yN + 33 }, 'Sudamérica'));
  g.appendChild(el('text', { class: 'oceano', transform: 'translate(24,520) rotate(-90)' }, 'Océano Pacífico'));

  ciudades.forEach(([nombre, lon, lat]) => {
    const [x, y] = proyMapa(lon, lat);
    g.appendChild(el('line', { x1: x, x2: 214, y1: y, y2: y, stroke: '#b9b2a2', 'stroke-width': 0.8 }));
    g.appendChild(el('circle', { cx: x, cy: y, r: 2, fill: '#4b5563' }));
    g.appendChild(el('text', { class: 'ciudad', x: 218, y: y + 4 }, nombre));
  });
  puntosMapa = new Map();
  [...todos.filter(e => !visSet.has(e)), ...todos.filter(e => visSet.has(e))].forEach(e => {
    const [x, y] = proyMapa(e.lon, e.lat);
    const fantasma = !visSet.has(e);
    const c = marcador(claseProf(e.prof), x, y, 3.8, colorMag(e.mag));
    c.setAttribute('class', 'ep' + (fantasma ? ' fantasma' : '') + (estado.sel === e ? ' sel' : ''));
    c._e = e;
    g.appendChild(c);
    if (!fantasma) {
      puntosMapa.set(e, c);
      c.addEventListener('mouseenter', () => { mostrarTip(e, c); marcarMapa(e, true); });
      c.addEventListener('mouseleave', () => { if (!animando) ocultarTip(); marcarMapa(e, estado.sel === e); });
      c.addEventListener('click', () => { if (arrastroMapa) return; estado.sel = e; marcar(); sonar(e); ondaMapa(e); mostrarTip(e, c); });
    }
  });
}

// Zoom del mapa: rueda del mouse, botones +/−/⟲, arrastrar para moverlo y doble clic para ver todo Chile
let vb = { x: 0, y: 0, w: MW, h: MH }, arrastroMapa = false;
function aplicarVB() {
  vb.w = Math.min(MW, Math.max(MW / 10, vb.w)); vb.h = vb.w * MH / MW;
  vb.x = Math.min(Math.max(vb.x, 0), MW - vb.w); vb.y = Math.min(Math.max(vb.y, 0), MH - vb.h);
  mapa.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  mapa.style.setProperty('--z', (MW / vb.w).toFixed(3));
}
// Zoom automático: el mapa "vuela" suavemente hasta el epicentro (al pasar por una barra o durante la reproducción)
let animVB = null, resetMapaT = null;
function volarVB(obj, ms) {
  cancelAnimationFrame(animVB);
  const d = { ...vb }, t0 = performance.now();
  const paso = ahora => {
    const f = Math.min(1, (ahora - t0) / ms), k = f < 0.5 ? 2 * f * f : 1 - Math.pow(-2 * f + 2, 2) / 2;
    vb.x = d.x + (obj.x - d.x) * k; vb.y = d.y + (obj.y - d.y) * k; vb.w = d.w + (obj.w - d.w) * k;
    aplicarVB();
    if (f < 1) animVB = requestAnimationFrame(paso);
  };
  animVB = requestAnimationFrame(paso);
}
function enfocarMapa(e, ms = 650) {
  clearTimeout(resetMapaT);
  const [x, y] = proyMapa(e.lon, e.lat), z = 4, w = MW / z, h = MH / z;
  volarVB({ x: Math.min(Math.max(x - w / 2, 0), MW - w), y: Math.min(Math.max(y - h / 2, 0), MH - h), w }, ms);
}
function verTodoElMapa(demora = 0, ms = 600) {
  clearTimeout(resetMapaT);
  resetMapaT = setTimeout(() => volarVB({ x: 0, y: 0, w: MW }, ms), demora);
}
function zoomMapa(factor, px = 0.5, py = 0.5) {
  cancelAnimationFrame(animVB); clearTimeout(resetMapaT);   // px, py: punto fijo del zoom (0 a 1 dentro del mapa)
  const nw = Math.min(MW, Math.max(MW / 10, vb.w * factor)), nh = nw * MH / MW;
  vb.x += (vb.w - nw) * px; vb.y += (vb.h - nh) * py; vb.w = nw; vb.h = nh;
  aplicarVB();
}
mapa.addEventListener('wheel', ev => {
  ev.preventDefault();
  const r = mapa.getBoundingClientRect();
  zoomMapa(ev.deltaY < 0 ? 0.8 : 1.25, (ev.clientX - r.left) / r.width, (ev.clientY - r.top) / r.height);
}, { passive: false });
let arrastre = null;
mapa.addEventListener('pointerdown', ev => { cancelAnimationFrame(animVB); clearTimeout(resetMapaT); arrastre = { x: ev.clientX, y: ev.clientY, mov: 0 }; });
window.addEventListener('pointermove', ev => {
  if (!arrastre) return;
  const r = mapa.getBoundingClientRect(), dx = ev.clientX - arrastre.x, dy = ev.clientY - arrastre.y;
  arrastre.mov += Math.abs(dx) + Math.abs(dy);
  if (arrastre.mov > 4) { arrastroMapa = true; mapa.classList.add('arrastrando'); }
  vb.x -= dx / r.width * vb.w; vb.y -= dy / r.height * vb.h;
  arrastre.x = ev.clientX; arrastre.y = ev.clientY;
  aplicarVB();
});
window.addEventListener('pointerup', () => { arrastre = null; mapa.classList.remove('arrastrando'); setTimeout(() => { arrastroMapa = false; }, 0); });
mapa.addEventListener('dblclick', () => verTodoElMapa(0, 400));
document.getElementById('zMas').addEventListener('click', () => zoomMapa(0.7));
document.getElementById('zMenos').addEventListener('click', () => zoomMapa(1 / 0.7));
document.getElementById('zReset').addEventListener('click', () => verTodoElMapa(0, 400));

function marcarMapa(e, on) {
  const c = puntosMapa.get(e);
  if (c) { c.classList.toggle('sel', on); if (on) c.parentNode.appendChild(c); }
}

function ondaMapa(e) {   // anillo que se expande desde el epicentro, como una onda sísmica
  setTimeout(() => {
    const [x, y] = proyMapa(e.lon, e.lat);
    const p = el('circle', { class: 'pulso', cx: x, cy: y, r: 3.5 });
    const g = mapa.querySelector('g');
    if (g) { g.appendChild(p); setTimeout(() => p.remove(), 1400); }
  }, latenciaMs());
}

// El gráfico y el mapa se sacuden, más fuerte y más tiempo mientras mayor es el terremoto
function sacudir(e) {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const f = (e.mag - 7) / 2.5, amp = 0.6 + 6 * f, dur = 350 + 1500 * f, n = Math.round(dur / 45);
  const kf = [];
  for (let i = 0; i <= n; i++) { const d = Math.pow(1 - i / n, 1.5) * amp; kf.push({ transform: `translate(${(Math.random() * 2 - 1) * d}px, ${(Math.random() * 2 - 1) * d * 0.6}px)` }); }
  kf.push({ transform: 'none' });
  document.querySelector('.cuerpo').animate(kf, { duration: dur, easing: 'linear' });
}

// ---------- Detalle al pasar el cursor ----------
const tip = document.getElementById('tip');
function mostrarTip(e, ancla) {
  const fecha = new Date(e.fecha + 'T12:00:00Z').toLocaleDateString('es-CL', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' });
  const ratio = Math.pow(10, 1.5 * (e.mag - 7));   // cada punto de magnitud = ~32 veces más energía
  const energia = ratio < 1.5 ? 'la energía de un M7' : '≈ ' + (ratio >= 100 ? Math.round(ratio / 100) * 100 : Math.round(ratio)).toLocaleString('es-CL') + '× la energía de un M7';
  tip.innerHTML = `<b>${e.lugar}</b><br>${fecha}${e.hora ? ', ' + e.hora.slice(0, 5) + ' UTC' : ''}<br>Magnitud ${fmtMag(e.mag)} · ${Math.round(e.prof)} km (${nombreClase[claseProf(e.prof)].toLowerCase()})<br><span class="en">⚡ ${energia}</span>`;
  tip.hidden = false;
  const tarjeta = document.getElementById('tarjeta').getBoundingClientRect();
  if (ancla) {   // detalle junto a un punto del mapa
    const r = ancla.getBoundingClientRect(), w2 = tip.offsetWidth;
    const x2 = Math.min(Math.max(r.left - tarjeta.left + r.width / 2, w2 / 2 + 4), tarjeta.width - w2 / 2 - 4);
    tip.style.left = x2 + 'px';
    tip.style.top = Math.max(r.top - tarjeta.top - 6, tip.offsetHeight + 4) + 'px';
    return;
  }
  const dot = ultimaPos.get(e);
  if (!dot) return;
  const lienzo = document.getElementById('lienzo');
  const lr = lienzo.getBoundingClientRect();
  let x = lr.left - tarjeta.left + dot.x - lienzo.scrollLeft;
  const y = lr.top - tarjeta.top + dot.y - RADIO - 8;
  const w = tip.offsetWidth;
  x = Math.min(Math.max(x, w / 2 + 4), tarjeta.width - w / 2 - 4);
  tip.style.left = x + 'px';
  tip.style.top = Math.max(y, tip.offsetHeight + 4) + 'px';
}
function ocultarTip() { tip.hidden = true; }

// ---------- Sonido ----------
// Magnitud -> TONO y retumbo: los chicos son un "tac" agudo y seco; los grandes, un golpe muy grave y un retumbo largo con temblor.
// Profundidad -> aspereza (más crujido en lo superficial) y ataque (más lento en lo profundo). Latitud -> estéreo (norte a la izquierda).
let busTone = null, ajusteSync = 0, ultimoNodos = null;
function atenuar(nodos) {   // desvanece rápido el sonido anterior para que no se pisen las colas
  nodos.forEach(n => { try { if (n.volume) n.volume.rampTo(-80, 0.12); } catch (_) {} });
}
// Retraso entre que se agenda el sonido y se oye (adelanto de Tone.js + navegador + salida; los audífonos Bluetooth suman mucho).
// El gráfico se retrasa ese tiempo (más el ajuste manual) para que la marca coincida con el sonido.
function latenciaMs() {
  if (!window.Tone) return ajusteSync;
  const raw = Tone.context.rawContext;
  return ((Tone.context.lookAhead || 0) + (raw.baseLatency || 0) + (raw.outputLatency || 0)) * 1000 + ajusteSync;
}
const panDe = e => -0.8 + 1.6 * ((e.lat - LAT_N) / (LAT_S - LAT_N));

function iniciarAudio() {
  if (window.Tone) return Tone.start().then(() => { Tone.context.lookAhead = 0.02; });   // el audio se desbloquea con un gesto del usuario
  return Promise.resolve();
}
document.addEventListener('pointerdown', () => iniciarAudio(), { once: true });

let resalte = null;   // solo un terremoto resaltado a la vez, igual que solo suena uno
function resaltarPunto(e, dur) {
  const c = [...svg.querySelectorAll('.sismo')].find(x => x._e === e);
  const lat = latenciaMs();
  setTimeout(() => sacudir(e), lat);
  if (!c) return;
  if (resalte) { clearTimeout(resalte.t1); clearTimeout(resalte.t2); resalte.c.classList.remove('sonando'); }
  const r = { c };
  r.t1 = setTimeout(() => c.classList.add('sonando'), lat);
  r.t2 = setTimeout(() => { c.classList.remove('sonando'); if (resalte === r) resalte = null; }, lat + dur * 1000);
  resalte = r;
}

function sonarTone(e, enCola) {
  if (Tone.context.state !== 'running') {   // el audio aún estaba bloqueado: se activa con el gesto del usuario y se reintenta
    Tone.start().then(() => { if (Tone.context.state === 'running') sonarTone(e, enCola); });
    return;
  }
  if (!busTone) busTone = new Tone.Limiter(-3).toDestination();   // evita saturación
  const clase = claseProf(e.prof);
  const fuerza = (e.mag - 7) / 2.5;                          // 0 (M7,0) a 1 (M9,5)
  const dur = 0.5 + 2.6 * fuerza;                            // 0,5 s -> 3,1 s
  const fGolpe = 200 * Math.pow(38 / 200, fuerza);           // golpe: 200 Hz (agudo) -> 38 Hz (muy grave)
  const corte = 2200 * Math.pow(0.04, fuerza);               // el retumbo se oscurece: 2200 Hz -> 88 Hz
  const asp = clase === 'sup' ? 0 : clase === 'med' ? -4 : -8;   // dB de aspereza según la profundidad
  const t = Tone.now();
  const nodos = [];
  const nodo = n => (nodos.push(n), n);
  if (enCola && ultimoNodos) atenuar(ultimoNodos);           // en la reproducción solo suena un terremoto a la vez
  ultimoNodos = nodos;

  const pan = nodo(new Tone.Panner(panDe(e))).connect(busTone);
  let salida = pan;
  if (fuerza > 0.3) salida = nodo(new Tone.Tremolo(4 + 6 * fuerza, 0.3 + 0.4 * fuerza).start()).connect(pan);   // temblor en los grandes

  // retumbo: ruido marrón filtrado, el sonido típico de un terremoto
  const filtro = nodo(new Tone.Filter({ type: 'lowpass', frequency: corte, Q: 1 })).connect(salida);
  const retumbo = nodo(new Tone.NoiseSynth({
    noise: { type: 'brown' },
    envelope: { attack: clase === 'prof' ? 0.18 : 0.02, decay: dur, sustain: 0, release: 0.3 },
    volume: -6 + 8 * fuerza + asp
  })).connect(filtro);
  retumbo.triggerAttackRelease(dur, t);

  // golpe seco: de "tac" agudo a golpe muy grave
  const golpe = nodo(new Tone.MembraneSynth({
    pitchDecay: 0.06, octaves: 3,
    envelope: { attack: 0.003, decay: Math.min(dur, 0.3 + 1.5 * fuerza), sustain: 0, release: 0.2 },
    volume: -8 + 4 * fuerza
  })).connect(salida);
  golpe.triggerAttackRelease(fGolpe, 0.1, t);

  // crujido de la roca al inicio (más en lo superficial, y más fuerte en los chicos)
  const crujido = nodo(new Tone.NoiseSynth({
    noise: { type: 'pink' },
    envelope: { attack: 0.001, decay: 0.05 + 0.1 * (1 - fuerza), sustain: 0, release: 0.02 },
    volume: -12 - 8 * fuerza + (clase === 'sup' ? 3 : clase === 'med' ? -1 : -6)
  })).connect(nodo(new Tone.Filter(1800, 'highpass')).connect(pan));
  crujido.triggerAttackRelease(0.05, t);

  // grave sostenido en los grandes: con armónicos, para que se oiga aunque el parlante sea chico
  if (fuerza > 0.35) {
    const filtroS = nodo(new Tone.Filter(Math.max(300, fGolpe * 8), 'lowpass')).connect(salida);
    const sub = nodo(new Tone.Synth({
      oscillator: { type: 'sawtooth' },
      envelope: { attack: clase === 'prof' ? 0.2 : 0.04, decay: dur, sustain: 0, release: 0.3 },
      volume: -24 + 16 * fuerza
    })).connect(filtroS);
    sub.triggerAttackRelease(Math.max(fGolpe, 40), dur, t);
  }

  setTimeout(() => nodos.forEach(n => { try { n.dispose(); } catch (_) {} }), (dur + 2.5) * 1000);
  resaltarPunto(e, dur);
}

// Motor de respaldo (Web Audio puro) si Tone.js no carga
let ctxB = null, ruidoB = null;
function sonarBasico(e) {
  if (!ctxB) {
    ctxB = new (window.AudioContext || window.webkitAudioContext)();
    ruidoB = ctxB.createBuffer(1, ctxB.sampleRate * 3, ctxB.sampleRate);
    const d = ruidoB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (ctxB.state === 'suspended') ctxB.resume();
  const fuerza = (e.mag - 7) / 2.5, dur = 0.5 + 2.6 * fuerza, t = ctxB.currentTime;
  const g = ctxB.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.4, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); g.connect(ctxB.destination);
  const o = ctxB.createOscillator(); o.type = 'sine'; o.frequency.value = 200 * Math.pow(38 / 200, fuerza); o.connect(g); o.start(t); o.stop(t + dur);
  const n = ctxB.createBufferSource(); n.buffer = ruidoB; const f = ctxB.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 2200 * Math.pow(0.04, fuerza);
  n.connect(f); f.connect(g); n.start(t, 0, Math.min(dur, 3));
  resaltarPunto(e, dur);
}
function sonar(e, enCola) { return window.Tone ? sonarTone(e, enCola) : sonarBasico(e); }

function probarSonido() {
  if (!window.Tone) { document.getElementById('status').textContent = 'No se pudo cargar Tone.js: se usa el sonido de respaldo.'; return; }
  Tone.start().then(() => {
    const sy = new Tone.Synth().toDestination();
    sy.triggerAttackRelease(440, 0.6);
    setTimeout(() => sy.dispose(), 1500);
    document.getElementById('status').textContent =
      `Tono de prueba enviado (audio: ${Tone.context.state}). Si no lo oyes, revisa el volumen y la salida de sonido del computador.`;
  });
}

// ---------- Reproducción cronológica ----------
const btnPlay = document.getElementById('btnPlay');
const btnStop = document.getElementById('btnStop');
let RITMO = 2500;   // ms entre un terremoto y el siguiente (ajustable en vivo): uno por vez, sin que se pisen

function textoEstado() {
  const n = visibles().length, t = enRango().length;
  return n === t ? `${n} terremotos` : `${n} de ${t} terremotos`;
}
function detener() {
  if (animando) { cancelAnimationFrame(animando.raf); clearTimeout(animando.timer); }
  animando = null;
  btnStop.hidden = true;
  btnPlay.hidden = false;
  const ph = document.getElementById('playhead');
  if (ph) { ph.setAttribute('x1', -10); ph.setAttribute('x2', -10); }
  ocultarTip();
  verTodoElMapa(0, 600);
  document.getElementById('status').textContent = textoEstado();
}

const ESPERA_AUDIO = 1000;
function calentarAudio() {   // la salida de audio (sobre todo Bluetooth) tarda en "despertar": se emite un tono casi inaudible
  if (!window.Tone) return;
  const o = new Tone.Oscillator(200, 'sine').toDestination();
  o.volume.value = -48;
  o.start().stop('+1.1');
  setTimeout(() => o.dispose(), 1500);
}

function reproducir() {
  detener();
  const lista = visibles().sort((a, b) => a.t - b.t);
  if (!lista.length) return;
  btnPlay.hidden = true; btnStop.hidden = false;
  document.getElementById('status').textContent = 'Preparando el audio…';
  animando = {};
  iniciarAudio().then(() => {
    if (!animando) return;   // se detuvo mientras se preparaba el audio
    calentarAudio();
    animando.timer = setTimeout(arrancar, ESPERA_AUDIO);
  });

  function arrancar() {
    const xs = lista.map(e => (ultimaPos.get(e) || { x: xDe(e.t) }).x);   // la línea recorre las barras tal como se ven
    let avance = 0, ultimo = performance.now(), i = 0, iv = 0, ultimoDisparo = -1e9;
    const lienzo = document.getElementById('lienzo');
    const paso = ahora => {
      // Si el navegador se atrasa, el tiempo se detiene en vez de "ponerse al día" disparando varios terremotos de golpe.
      avance += Math.min(ahora - ultimo, 100) / RITMO; ultimo = ahora;
      const k = Math.min(Math.floor(avance), lista.length - 1);
      if (i <= k && ahora - ultimoDisparo >= 0.85 * RITMO) { sonar(lista[i], true); ondaMapa(lista[i]); i++; ultimoDisparo = ahora; }   // estrictamente en orden y nunca dos juntos
      const av = Math.max(0, avance - latenciaMs() / RITMO);   // lo que se ve va retrasado lo que tarda en oírse
      const kv = Math.min(Math.floor(av), lista.length - 1);
      while (iv <= kv) {
        mostrarTip(lista[iv]);
        enfocarMapa(lista[iv], Math.min(900, RITMO * 0.4));
        document.getElementById('status').textContent = `${lista[iv].anio} · ${iv + 1} de ${lista.length}`;
        iv++;
      }
      const x = kv < lista.length - 1 ? xs[kv] + (xs[kv + 1] - xs[kv]) * (av - kv) : xs[kv];
      const ph = document.getElementById('playhead');
      ph.setAttribute('x1', x); ph.setAttribute('x2', x);
      lienzo.scrollLeft = x - lienzo.clientWidth / 2;   // el gráfico acompaña a la línea si hay scroll
      if (av < lista.length) animando.raf = requestAnimationFrame(paso);
      else setTimeout(detener, 2500);
    };
    animando.raf = requestAnimationFrame(paso);
  }
}

btnPlay.addEventListener('click', reproducir);
btnStop.addEventListener('click', detener);
document.getElementById('btnTest').addEventListener('click', probarSonido);

// ---------- Controles ----------
function refrescar() { detener(); dibujar(); }
document.getElementById('minMag').addEventListener('input', ev => {
  estado.minMag = Number(ev.target.value);
  document.getElementById('vMag').textContent = estado.minMag.toFixed(1);
  refrescar();
});
document.getElementById('ritmo').addEventListener('input', ev => {
  RITMO = Number(ev.target.value) * 1000;
  document.getElementById('vRitmo').textContent = Number(ev.target.value).toString().replace('.', ',') + ' s';
});
document.getElementById('sync').addEventListener('input', ev => {
  ajusteSync = Number(ev.target.value);
  document.getElementById('vSync').textContent = ajusteSync + ' ms';
});
[['cSup', 'sup'], ['cMed', 'med'], ['cProf', 'prof']].forEach(([id, k]) =>
  document.getElementById(id).addEventListener('change', ev => { estado[k] = ev.target.checked; refrescar(); })
);

document.getElementById('version').textContent = VERSION_SONIDO;
dibujar();
</script>
